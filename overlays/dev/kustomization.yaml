apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: orders-dev
resources:
  - ../../base
  - migration-job.yaml
replicas:
  - name: orders-web
    count: 1
images:
  - name: nginx
    newTag: "1.25"
patches:
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: orders-web-config
        annotations:
          argocd.argoproj.io/sync-wave: "0"
      data:
        APP_ENV: dev
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: orders-web
        annotations:
          argocd.argoproj.io/sync-wave: "2"
  - patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: orders-web
        annotations:
          argocd.argoproj.io/sync-wave: "2"
