apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: orders-prod
resources:
  - ../../base
replicas:
  - name: orders-web
    count: 3
images:
  - name: nginx
    newTag: "1.26"
patches:
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: orders-web-config
      data:
        APP_ENV: prod
